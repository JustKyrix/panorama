# =============================================================================
#  Veroeffentlicht die Seite auf GitHub Pages - bei jedem Push auf main.
#
#  Der Seiteninhalt liegt in website/, nicht im Repo-Wurzelverzeichnis, deshalb
#  laeuft das ueber Actions und nicht ueber "deploy from a branch": so muss
#  weder ein gh-pages-Branch gepflegt noch der Build verschoben werden.
#
#  configure-pages mit enablement: true schaltet Pages beim ersten Lauf selbst
#  ein, damit das nicht von Hand in den Repo-Einstellungen passieren muss.
#
#  Das CSS wird hier neu gebaut, statt dem eingecheckten Stand zu vertrauen -
#  so kann die veroeffentlichte Seite nicht von den Quellen abweichen, falls
#  ein Build mal vergessen wurde.
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur lesen fuer den Code, schreiben ausschliesslich fuer Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht doppelt starten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: website
        run: npm ci

      - name: CSS bauen
        working-directory: website
        run: npm run build

      # Nur das zusammenstellen, was die Seite wirklich braucht. website/ als
      # Ganzes hochzuladen wuerde node_modules mitnehmen - das legt npm ci im
      # Schritt davor an - und dazu die SCSS-Quellen und die Build-Skripte.
      # Derselbe Umfang wie im Plesk-Archiv.
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp website/index.html _site/
          cp -r website/assets _site/

      # Ohne enablement: true. Das Anlegen der Pages-Seite ueber die API ist
      # dem GITHUB_TOKEN nicht erlaubt ("Resource not accessible by
      # integration"), auch mit pages: write. Die Quelle wird deshalb einmal
      # von Hand auf "GitHub Actions" gestellt (Settings -> Pages -> Source);
      # dieser Schritt liest sie dann nur noch aus.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
